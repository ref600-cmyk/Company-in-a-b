<!doctype html>
<html lang="en">
  <head>
    <script>
      // Per AI Studio environment constraints: HMR is disabled, ignore WebSocket / @vite/client errors
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.includes('WebSocket') || msg.includes('ws') || msg.includes('vite') || msg.includes('vite:ws')) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || '')) + ' ' + ((event && event.filename) || '');
        if (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('vite:ws')) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    </script>
