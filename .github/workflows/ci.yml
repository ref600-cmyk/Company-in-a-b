name: SkyShadow Local-Mesh CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Deterministic Unit Tests
        run: node --test src/utils/*.test.ts

      - name: Verify TypeScript & Build
        run: |
          npm run lint
          npm run build
